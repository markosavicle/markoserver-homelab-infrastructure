services:
  homarr:
    image: ghcr.io/ajnart/homarr:latest
    container_name: homarr
    restart: always
    ports:
      - '7575:7575'
    volumes:
      - ./configs:/app/data/configs
      - ./icons:/app/public/icons
      - ./data:/data
    networks:
      - nginx-net

networks:
  nginx-net:
    external: true
