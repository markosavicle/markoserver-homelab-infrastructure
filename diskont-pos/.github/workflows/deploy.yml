name: Deploy Diskont POS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Pull latest changes and restart containers
        run: |
          cd /home/markoserver/docker/dashboard
          git pull origin main
          docker compose up -d --build
