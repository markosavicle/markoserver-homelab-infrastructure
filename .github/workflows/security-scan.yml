name: Security Scan
on:
  push:
    paths:
      - 'diskont-pos/**'
  pull_request:
    branches: [ main, dev ]

jobs:
  trivy-scan:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t diskont-pos-backend:scan ./diskont-pos/backend

      - name: Build frontend image
        run: docker build -t diskont-pos-frontend:scan ./diskont-pos/frontend

      - name: Scan backend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'diskont-pos-backend:scan'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Scan frontend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'diskont-pos-frontend:scan'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
