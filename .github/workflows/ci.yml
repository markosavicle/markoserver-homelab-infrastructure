name: CI Checks (PR Validation)

on:
  pull_request:
    branches:
      - main

jobs:
  validate-pos:
    name: Validate Diskont POS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './diskont-pos/frontend/package-lock.json'

      - name: Install & Test Frontend
        run: |
          cd diskont-pos/frontend
          npm ci
          npm run build

      - name: Install & Test Backend
        run: |
          cd diskont-pos/backend
          npm ci