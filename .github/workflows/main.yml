name: Deploy Homelab Infrastructure

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Smart Deploy Updated Services
        run: |
          cd /home/markoserver/docker
          
          # Fetch latest commits without merging yet
          git fetch origin main
          
          # Get list of changed files between current local HEAD and remote origin/main
          CHANGED_FILES=$(git diff --name-only HEAD origin/main)
          echo "Changed files:"
          echo "$CHANGED_FILES"
          
          # Now pull the updates
          git pull origin main

          # Loop through service directories
          for service_dir in */; do
            service_name=$(basename "$service_dir")
            
            # Skip hidden directories
            if [[ "$service_name" == .* ]]; then
              continue
            fi

            # Check if directory contains a docker-compose file
            if [ -f "$service_dir/docker-compose.yml" ] || [ -f "$service_dir/docker-compose.yaml" ]; then
              if echo "$CHANGED_FILES" | grep -q "^${service_name}/"; then
                echo "--> Changes detected in ${service_name}. Rebuilding service..."
                (cd "$service_dir" && docker compose up -d --build)
              else
                echo "--> No changes in ${service_name}. Skipping."
              fi
            fi
          done
