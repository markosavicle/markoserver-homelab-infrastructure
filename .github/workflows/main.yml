name: Deploy Homelab Infrastructure

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE20: false

      - name: Pull latest code and restart dashboard services
        run: |
          cd /home/markoserver/docker/dashboard
          git pull origin main
          docker compose up -d
