name: Deploy Homelab Infrastructure

on:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Pull latest code and restart dashboard services
        run: |
          cd /home/markoserver/docker/dashboard
          git pull origin main
          docker compose up -d
